name: Build
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> build/cargo
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config libssl-dev libfontconfig1-dev libfreetype-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libzstd-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Package application
        shell: pwsh
        run: ./tools/package-release.ps1
      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          path: dist/pte-explorer-*.*
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download executable archives
        uses: actions/download-artifact@v8
        with:
          pattern: pte-explorer-*
          path: release-assets
          merge-multiple: true
          skip-decompress: true
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          assets=(
            release-assets/pte-explorer-windows-x64.zip
            release-assets/pte-explorer-macos-arm64.tar.gz
            release-assets/pte-explorer-linux-x64.tar.gz
          )
          for asset in "${assets[@]}"; do
            test -s "$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt; then
            if [[ "$(cat release-state.txt)" != true ]]; then
              echo "Release $RELEASE_TAG is already published; leaving it unchanged." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --draft --verify-tag --generate-notes --title "PTE Explorer $RELEASE_TAG"
          fi
