[package]
name = "pte-explorer"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "GPU accelerated ExecuTorch and Ethos-U command stream explorer"

[features]
default = ["gui"]
gui = ["dep:gpui", "dep:windows"]
ui-tests = ["gui", "gpui/test-support"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
gpui = { version = "=0.2.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", optional = true, features = ["Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_Console"] }

[[bin]]
name = "pte-explorer"
path = "src/main.rs"

