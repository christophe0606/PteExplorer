[package]
name = "pte-explorer"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "GPU accelerated ExecuTorch and Ethos-U command stream explorer"

[features]
default = ["gui"]
gui = ["dep:gpui", "dep:windows", "dep:libc", "dep:url"]
ui-tests = ["gui", "gpui/test-support"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
gpui = { version = "=0.2.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
url = { version = "2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# GPUI 0.2.2 -> gpui_http_client -> zed-async-tar -> xattr 0.2.3 uses
# ENOATTR, removed on Linux in libc 0.2.190. Remove this compatibility pin
# once GPUI no longer pulls in xattr 0.2.
libc = { version = "=0.2.189", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", optional = true, features = ["Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_Console"] }

[[bin]]
name = "pte-explorer"
path = "src/main.rs"

